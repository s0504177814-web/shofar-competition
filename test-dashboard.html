<script>
let reps=[], sales={};
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
async function login(){
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){statusEl('שגיאת כניסה: '+error.message,false);return}
 await start();
}
function statusEl(t,ok=true){const e=document.getElementById('status');e.textContent=t;e.className=ok?'ok':'err'}
async function load(){
 const d=today();
 const [setR,repR,saleR]=await Promise.all([
   sb.from('campaign_settings').select('*').eq('id',1).maybeSingle(),
   sb.from('representatives').select('*').eq('active',true).order('sort_order'),
   sb.from('daily_sales').select('*').eq('sale_date',d)
 ]);
 if(setR.error||repR.error||saleR.error){statusEl('שגיאת קריאה',false);return}
 document.getElementById('target').value=setR.data?.daily_target||50000;
 reps=repR.data||[]; sales={}; (saleR.data||[]).forEach(x=>sales[x.representative_id]=Number(x.amount)||0);
 document.getElementById('reps').innerHTML=reps.map(r=>`<div class="rep"><b>${r.name}</b><input id="s_${r.id}" type="number" value="${sales[r.id]||0}"><button onclick="saveSale('${r.id}')">שמור</button></div>`).join('');
 statusEl('מחובר לענן ✓');
}
async function saveTarget(){
 const v=Number(document.getElementById('target').value)||0;
 const {error}=await sb.from('campaign_settings').update({daily_target:v,updated_at:new Date().toISOString()}).eq('id',1);
 statusEl(error?'שגיאה בשמירת יעד':'היעד נשמר בענן ✓',!error);
}
async function saveSale(id){
 const amount=Number(document.getElementById('s_'+id).value)||0, d=today();
 const existing=await sb.from('daily_sales').select('id').eq('sale_date',d).eq('representative_id',id).maybeSingle();
 let res;
 if(existing.data?.id) res=await sb.from('daily_sales').update({amount,updated_at:new Date().toISOString()}).eq('id',existing.data.id);
 else res=await sb.from('daily_sales').insert({sale_date:d,representative_id:id,amount});
 statusEl(res.error?'שגיאה בשמירת סכום':'הסכום נשמר בענן ✓',!res.error);
}
async function start(){
 const {data}=await sb.auth.getSession();
 if(!data.session){statusEl('יש להתחבר כדי לערוך');return}
 document.getElementById('loginBox').style.display='none';document.getElementById('app').style.display='block';await load();
 sb.channel('dash-test').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe();
}
start();
</script>
